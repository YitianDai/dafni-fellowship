kind: M
api_version: v1beta3
metadata:
  display_name: GB storm cascade figures
  name: gb-storm-cascade-figures
  summary: Network map, hourly cascade frames, GIF and viewer, cascade stages figure and ensemble summary.
  description: >
    Draws the ETYS network on the ERA5 gust field (lightened) with isobars, marks wind-damaged lines (red),
    cascade trips (orange) and disconnected demand (purple circles sized by MW), one frame per hour with
    four side panels (gust, lines lost, demand disconnected, GB demand served). Produces the network-only map,
    the frames folder, an animated GIF, a self-contained HTML viewer, the cascade stages figure and, where at
    least five cascade samples exist, the ensemble figure.
    Output: results/<storm>/figs/.
  publisher: Yitian Dai, The University of Manchester
  source_code: https://github.com/YitianDai/dafni-fellowship
spec:
  inputs:
    parameters:
      - name: STORM
        title: Storm case
        description: Folder name of the storm case, Arwen2021 or Eunice2022
        type: string
        default: Arwen2021
        required: true
      - name: FIGURE_SAMPLE
        title: Cascade sample to draw
        type: integer
        default: 0
        min: 0
        required: true
    dataslots:
      - name: GB storm network cases
        description: Hourly PYPOWER cases exported from PyPSA-GB (bus, branch, gen, load_Pd, gen_Pmax, GB_ETYS_<storm>.py), one folder per storm
        path: inputs/network/
        required: true
      - name: ERA5 storm fields
        description: Hourly ERA5 10 m gust, 10 m wind components and mean sea level pressure over GB for each storm (era5_<storm>.nc)
        path: inputs/era5/
        required: true
      - name: Previous model outputs
        description: results/<storm>/ written by the upstream model(s) in the workflow
        path: inputs/results/
        required: true
  outputs:
    datasets:
      - name: "**/figs/*.png"
        type: png
        description: Network map, cascade stages and ensemble figures
      - name: "**/figs/*_cascade_frames/*.png"
        type: png
        description: One frame per hour of the storm window
      - name: "**/figs/*.gif"
        type: gif
        description: Animated cascade
      - name: "**/figs/*.html"
        type: html
        description: Self-contained cascade viewer
